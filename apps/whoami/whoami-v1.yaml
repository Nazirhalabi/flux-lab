apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: lab
spec:
  replicas: 4
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      serviceAccountName: whoami-sa
      containers:
      - name: whoami
        image: traefik/whoami
        env:
        - name: min-config
          valueFrom:
            configMapKeyRef:
              name: configmap-demo
              key: env
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-service
  namespace: lab
spec:
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80